plugins {
    id 'java-library'
}

description = '공공데이터포털 표준 기술문서(DOCX/HWP/HWPX)를 중간 규격(IR) JSON으로 변환'

dependencies {
    // poi-ooxml이 끌어오는 poi-ooxml-lite는 POI 자체 테스트가 쓰는 스키마만 담는다. 머리글의 글상자를 품은 VML 도형(v:polyline 등)을
    // 만나면 SchemaTypeLoaderException으로 문서 전체를 읽지 못해, 전체 스키마판으로 바꾼다. 둘은 같은 클래스를 담아 함께 두지 않는다
    implementation('org.apache.poi:poi-ooxml:5.2.5') {
        exclude group: 'org.apache.poi', module: 'poi-ooxml-lite'
    }
    implementation 'org.apache.poi:poi-ooxml-full:5.2.5'
    // POI가 log4j2-api를 쓰므로 구현체가 없으면 StatusLogger 에러가 출력됨
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.23.1'
    // HWP(바이너리) 문서 파싱. 외부 의존성 없이 자체 OLE 리더를 내장하고 있음
    implementation 'kr.dogfoot:hwplib:1.1.10'
    // HWPX(신형식, OWPML) 문서 파싱
    implementation 'kr.dogfoot:hwpxlib:1.0.9'
    // ParsedApi가 ObjectNode를 노출하므로 api 스코프
    api 'com.fasterxml.jackson.core:jackson-databind:2.17.1'

    // 산출한 IR이 generator의 검증(IrLoader)을 통과하는지 라운드트립 테스트용
    testImplementation project(':generator')
}

// IR의 metadata.parserVersion이 읽는 값. 배포판 jar에만 들어간다.
tasks.named('jar') {
    manifest {
        attributes('Implementation-Version': project.version)
    }
}

// 커밋된 HWPX 픽스처를 다시 만들 때만 쓰는 일회성 태스크.
// 포털이 HWPX 기술문서를 배포하지 않아 hwpxlib으로 표준 문서 구조를 합성한다.
// 문단 id와 zip 타임스탬프가 매번 달라 산출물이 바이트 단위로 재현되지는 않는다.
// 문서 구조를 바꿀 때만 돌리고, 그 외에는 커밋된 파일을 그대로 쓴다.
tasks.named('test') {
    // 픽스처 생성 전용이라 일반 테스트 실행에서는 제외한다
    exclude '**/HwpxFixtureWriter.class'
}

tasks.register('writeHwpxFixture', Test) {
    useJUnitPlatform()
    filter { includeTestsMatching 'kr.go.h2spec.parser.HwpxFixtureWriter' }
    systemProperty 'h2spec.fixture.out',
            project.findProperty('out') ?: "$rootDir/cli/src/test/resources/docs/msrstn-info.hwpx"
    outputs.upToDateWhen { false }
}

// rule 엔진의 IR golden 파일(src/test/resources/golden/rule-ir)을 지금 코드로 다시 쓴다.
// rule 엔진의 IR을 의도해서 바꿨을 때만 돌리고, 바뀐 golden 파일을 검토해 코드와 함께 커밋한다
tasks.register('writeRuleIrGolden', Test) {
    description = 'rule 엔진의 IR golden 파일을 지금 코드로 다시 쓴다'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'kr.go.h2spec.parser.RuleIrGoldenTest' }
    systemProperty 'h2spec.golden.write', 'true'
    outputs.upToDateWhen { false }
}
