plugins {
    id 'java-library'
}

description = '공공데이터 API의 200 OK 위장 에러를 잡는 Spring 인터셉터와 에러코드 사전'

dependencies {
    // 공개 타입의 시그니처에 드러나므로 api다. implementation으로 두면 소비자가
    // PublicDataErrorInterceptor를 생성하는 코드조차 컴파일하지 못한다.
    api 'org.springframework:spring-web:6.1.6'          // ClientHttpRequestInterceptor
    api 'org.springframework:spring-webflux:6.1.6'      // ExchangeFilterFunction, Mono

    // 이 모듈의 공개 API에는 안 드러나지만, generator가 만든 클라이언트가 모두
    // ObjectMapper/@JsonProperty를 쓴다. 생성 코드는 소비자 프로젝트에서 컴파일되므로
    // implementation으로 두면 소비자가 매번 직접 선언해야 한다.
    api 'com.fasterxml.jackson.core:jackson-databind:2.17.1'

    testImplementation 'org.springframework:spring-test:6.1.6'
    testImplementation 'org.hamcrest:hamcrest:2.2'
}
