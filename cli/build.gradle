plugins {
    id 'application'
}

description = '명세 문서를 OpenAPI 스펙과 Spring 클라이언트로 변환하는 커맨드라인 도구'

dependencies {
    implementation project(':generator')
    implementation project(':parser')
    // --engine llm. 기본 엔진은 rule이라 이 모듈의 코드는 --engine llm을 고를 때만 돈다
    implementation project(':parser-llm')
    implementation 'info.picocli:picocli:4.7.6'
}

application {
    mainClass = 'kr.go.h2spec.cli.H2SpecCli'
    // installDist 산출물이 build/install/h2spec/bin/h2spec 이 되도록
    applicationName = 'h2spec'
}

tasks.named('test') {
    // 테스트가 --cache-dir을 빠뜨려도 llm 엔진의 기본 캐시 위치가 사용자의 ~/.cache(Windows는 LOCALAPPDATA)가 아니라
    // 빌드 디렉터리가 되게 한다. CLI는 llm 엔진으로 변환할 때마다 그 캐시를 정리하므로 실제 캐시를 건드리면 안 된다
    environment 'XDG_CACHE_HOME', layout.buildDirectory.dir('test-cache').get().asFile.absolutePath
    environment 'LOCALAPPDATA', layout.buildDirectory.dir('test-cache').get().asFile.absolutePath
}

// --version 이 읽는 값. 배포판 jar에만 들어간다.
tasks.named('jar') {
    manifest {
        attributes('Implementation-Version': project.version)
    }
}
