plugins {
    id 'application'
}

description = 'IR JSON에서 OpenAPI 3.0 스펙과 Spring 클라이언트/DTO 코드를 생성'

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'

    // 생성된 소스의 컴파일 검증(javac)에 필요한 classpath
    testImplementation project(':interceptor-core')
    testImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.17.1'
    testImplementation 'org.springframework:spring-web:6.1.6'
}

application {
    mainClass = 'kr.go.h2spec.generator.Main'
}
